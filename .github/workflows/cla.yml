name: CLA

# Contributor License Agreement gate.
#
# Blocks a pull request until every human author has signed CLA.md. Signatures are
# recorded in .github/cla/signatures.json in this repository, committed by the action.
#
# SECURITY NOTE — why pull_request_target is safe here:
# pull_request_target runs in the context of the BASE repository, with repository secrets
# and write permissions, which makes it dangerous in any workflow that then checks out and
# executes the pull request's code. This workflow never checks out the PR. There is no
# actions/checkout step at all and nothing from the fork is executed. Do not add one.

# DISABLED 2026-09-05 — there are no external contributors yet.
#
# The automatic triggers are commented out rather than deleted, so re-enabling is
# one uncomment. Both were reachable by any GitHub user — `issue_comment` fires on
# a comment from anyone on any issue or PR, `pull_request_target` on any fork PR
# (13 forks exist) — and every run handed a third-party action a token carrying
# `contents: write`, `statuses: write` and `actions: write` on this repository.
# That is a standing capability bought for nothing so far: this workflow was added
# 2026-08-06 and the most recent pull request (#21) is 2026-07-25, so it has never
# executed once.
#
# BEFORE RE-ENABLING, fix the blocker that would make it fail anyway: the action
# commits signatures to `branch: 'main'` below, and main requires a pull request,
# so a direct push from GITHUB_TOKEN is rejected. Point it at a dedicated
# signatures branch first, then restore the two triggers.
on:
  workflow_dispatch:
  # issue_comment:
  #   types: [created]
  # pull_request_target:
  #   types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        # Runs on a new/updated PR, and on the comment a contributor posts to sign.
        if: |
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla/signatures.json'
          path-to-document: 'https://github.com/gl0di/clawseccheck/blob/main/CLA.md'
          branch: 'main'
          # The maintainer and bots cannot and need not sign: dependabot has no legal
          # personality, and the maintainer is the party the agreement is made with.
          allowlist: gl0di,dependabot[bot],*[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read
            **[CLA.md](https://github.com/gl0di/clawseccheck/blob/main/CLA.md)** and sign by
            posting the sentence below as a new comment on this pull request. It states
            plainly what you are agreeing to, including the part about commercial use —
            section 5 is the one worth reading. You only do this once, for all future
            contributions.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          lock-pullrequest-aftermerge: false
