name: Publish to ClawHub

# Publishes the skill to ClawHub:
#   - automatically when a release tag (vX.Y.Z) is pushed, and
#   - manually via the "Run workflow" button (workflow_dispatch).
# Auth uses the CLAWHUB_TOKEN repo secret — no local login needed.
# One-time setup (done): create a clh_ token at https://clawhub.ai/dashboard and add it
# as a repo secret named CLAWHUB_TOKEN (Settings -> Secrets and variables -> Actions).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (blank = use SKILL.md frontmatter version)"
        required: false
        default: ""
      skip_previous_release_check:
        description: "Publish even if the PREVIOUS release never surfaced on ClawHub"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A8: without this the job's default is 360 minutes while it holds CLAWHUB_TOKEN +
    # contents:write + id-token:write — and the Publish step has already demonstrated a
    # real ~10.5-minute hang (see that step's own comment, 2026-08-06 incident). 90
    # minutes covers the normal worst case — smoke-gate test suite, both preflight
    # curl checks with their retries, the actual publish, "Confirm publication
    # surfaced"'s own up to 40-minute poll (C-368) plus the pre-existing warn-only
    # surfaced-check's up to 10-minute poll (both can run back-to-back on a
    # CLI-reported failure) — with headroom for a slow runner, while still catching a
    # genuine hang well short of the 360-minute default.
    timeout-minutes: 90
    # contents:write is needed to create the GitHub Release (the repo default token is
    # read-only). id-token:write is needed for cosign's keyless/OIDC signing below (it
    # exchanges the job's short-lived GitHub Actions OIDC token for a Fulcio cert — no
    # signing key/secret to manage or leak). Both scoped to this job only.
    permissions:
      contents: write
      id-token: write
    # Manual-approval gate: configure required reviewers under
    # repo Settings → Environments → "release" for this gate to actually block.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # clawhub@0.23.3 declares "engines": { "node": ">=22" } in its package.json
          # (unchanged since 0.22.0). On Node 20 every publish ran under an npm
          # EBADENGINE warning — the CLI was executing outside its supported range
          # while holding the release token.
          # Keep this >= the pinned clawhub's declared engine (C-248).
          node-version: "22"

      - name: Install ClawHub CLI
        # Pinned to exact version to prevent supply-chain risk from a compromised
        # or typosquatted release executing with the CLAWHUB_TOKEN release secret.
        # Bumped 0.22.0 -> 0.23.3 (CLAWSECCHECK-B-440): v3.59.0's publish 413'd
        # (Request Entity Too Large) on a bundle well under ClawHub's documented
        # 50MB limit — filed openclaw/clawhub#3375. Root cause per their fix,
        # openclaw/clawhub#3391 ("upload skill files directly to Convex"): the old
        # path sent the whole bundle through a Vercel-fronted route with an
        # undocumented, much lower infra body-size cap. 0.23.3 is the first CLI
        # release built against the new bounded-ticket Convex upload route; older
        # pins would keep hitting the old (now-replaced) path. Confirmed by reading
        # the 0.23.3 tarball: publish.js now requests an `uploadUrl`/`uploadTicket`
        # pair instead of building the old raw multipart form body, and --dry-run
        # (options.dryRun) is unchanged.
        run: npm i -g clawhub@0.23.3

      - name: Resolve & verify version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          FM="$(grep -m1 '^version:' SKILL.md | awk '{print $2}')"
          if [ -n "${INPUT_VERSION}" ]; then
            VER="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$FM"
          fi
          echo "resolved version=$VER  (SKILL.md frontmatter=$FM)"
          if [ "$VER" != "$FM" ]; then
            echo "::error::Version '$VER' does not match SKILL.md frontmatter '$FM' — bump SKILL.md first."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Gate — the commit being published must be on main with green CI
        # C-544. Branch protection defends `main` with six required contexts; the tag-push
        # path that actually ships to users consulted none of them. This job's own smoke
        # gate is strictly weaker than that protection — Python 3.12 only, no 3.9, no
        # macOS, no gitleaks, no markdownlint, no commit-integrity — so a regression those
        # catch could reach ClawHub while `main` would have rejected it. The 3.9 gap is not
        # theoretical: on 3.9 `ipaddress` reports 0.0.0.0/0 as private, which once made
        # B2/B70 accept a world-open trustedProxies and emit the exact lying PASS the check
        # existed to prevent; it was caught on a tag only because a human was watching CI.
        #
        # Reading the SHA's own check-runs is far cheaper than duplicating the 3.9/macOS
        # matrix into this job, and pulls gitleaks, markdownlint and commit-integrity onto
        # the release path for free. The list below IS a second copy of branch protection's
        # required contexts — there is no API-free way to avoid that — so it is kept honest
        # from the other end: tests/test_ci_workflow.py asserts it equals the set of ci.yml
        # jobs that run on a push to main, so both narrowing this list and adding a new
        # protected job fail the build.
        #
        # Paired with ci.yml no longer running on tag pushes (C-543): these contexts come
        # from the push to `main` that preceded the tag, so nothing is re-run to satisfy
        # this. §6 already requires main's CI to be green BEFORE tagging, so the poll is a
        # lag absorber, not a substitute for that — but it is sized to cover a full run
        # (measured: 23m36s for c26a8ba, the 3.9 leg alone 23m32s) because a tag pushed a
        # minute early would otherwise kill the job AND spend the release approval, which
        # is granted before any step runs and would have to be granted again on the re-run.
        env:
          GH_TOKEN: ${{ github.token }}
          # A literal block (|), not a folded one (>-): folding joins these with spaces,
          # and a context name is matched against the check-run name exactly, so a stray
          # space would make every lookup miss and the gate would report all six missing.
          REQUIRED_CONTEXTS: |
            test (ubuntu-latest, 3.9)
            test (ubuntu-latest, 3.12)
            test (macos-latest, 3.12)
            markdownlint
            secret-scan
            commit-integrity
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main. Only code that" \
                 "reached main through its required checks may be published; tag pushes are" \
                 "not covered by branch protection, so this is the only thing standing" \
                 "between an arbitrary commit and a release."
            exit 1
          fi
          echo "OK: ${GITHUB_SHA} is on main."

          # An empty list would make every loop below find nothing and the gate would
          # announce success having checked nothing — the one way this step can fail OPEN,
          # so the shell refuses it directly rather than relying on a test to notice.
          # (Unset already dies under `set -u`; empty did not.)
          if [ -z "${REQUIRED_CONTEXTS//[[:space:]]/}" ]; then
            echo "::error::REQUIRED_CONTEXTS is empty — the gate would pass vacuously."
            exit 1
          fi

          # A never-run context is indistinguishable from a deleted one here, so absence is
          # a failure, not a skip: this gate exists precisely for the case where nothing ran.
          for attempt in $(seq 1 30); do
            # app.id 15368 is GitHub Actions, which is what branch protection pins each of
            # these contexts to — without the filter any app could satisfy a required name.
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
                      --paginate --jq '.check_runs[] | select(.app.id == 15368)
                                       | [.name, .status, (.conclusion // "")] | @tsv')"
            PENDING=""; FAILED=""; MISSING=""
            while IFS= read -r ctx; do
              [ -n "$ctx" ] || continue
              # One name can appear more than once on a SHA — measured on c26a8ba, each of
              # the six appears TWICE, from two check-suites (a PR suite and a push suite),
              # because the endpoint's `latest` filter does not dedupe across suites. Taking
              # the first row would make the verdict depend on the API's undocumented
              # ordering, and a green copy listed before a failed one would pass the gate.
              # So every matching row is folded and the WORST outcome wins.
              ROWS="$(printf '%s\n' "$RUNS" | awk -F'\t' -v c="$ctx" '$1==c')"
              if [ -z "$ROWS" ]; then MISSING="${MISSING}${ctx}; "; continue; fi
              if printf '%s\n' "$ROWS" | awk -F'\t' '$2!="completed"' | grep -q .; then
                PENDING="${PENDING}${ctx}; "
              elif BAD="$(printf '%s\n' "$ROWS" | awk -F'\t' '$3!="success" {print $3; exit}')" \
                   && [ -n "$BAD" ]; then
                FAILED="${FAILED}${ctx}=${BAD}; "
              fi
            done <<< "$REQUIRED_CONTEXTS"

            if [ -n "$FAILED" ]; then
              echo "::error::Required checks did not pass on ${GITHUB_SHA}: ${FAILED}"
              exit 1
            fi
            if [ -z "$PENDING" ] && [ -z "$MISSING" ]; then
              echo "OK: all required checks are green on ${GITHUB_SHA}."
              exit 0
            fi
            echo "waiting (${attempt}/30) — pending: ${PENDING:-none}; missing: ${MISSING:-none}"
            if [ "$attempt" -lt 30 ]; then sleep 60; fi
          done

          echo "::error::Required checks never completed on ${GITHUB_SHA} — pending:" \
               "${PENDING:-none}; missing: ${MISSING:-none}. A missing context means CI" \
               "never ran for this commit, which is exactly what this gate exists to catch."
          exit 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Smoke gate — lint, tests, compile
        run: |
          # Pinned to exact versions (not `-U`): this job later authenticates with the
          # CLAWHUB_TOKEN release secret and holds contents/id-token:write, so a
          # compromised or typosquatted pytest/ruff release must not be able to execute
          # here (C-183 — same supply-chain discipline as the pinned clawhub@0.23.3
          # install above). Bump these deliberately, like clawhub@ / markdownlint-cli@.
          set -euo pipefail
          python -m pip install pytest==7.4.4 ruff==0.15.20
          python -m pytest -q
          ruff check .
          python -m compileall clawseccheck

      - name: Generate trusted engine digest (SHA256SUMS.txt)
        # Reuses clawseccheck/integrity.py's package_digest() — the exact same
        # sorted "relpath:sha256hex" combine logic that `--verify-self` prints —
        # so the file a user diffs against is byte-for-byte the same computation,
        # just produced out-of-band (from this checked-out tag, in CI) instead of
        # from inside their own possibly-tampered install.
        #
        # B-590: the `notes` channel is opted into and its rows are annotated exactly as
        # `--verify-self` annotates them. A symlink's row is a digest of the LINK (its
        # name and target), not of any file's bytes, and this listing is cosign-signed —
        # an unannotated row would be a false statement inside a signed artifact, and the
        # two listings would silently stop matching, which is what the paragraph above
        # promises they do. The repo has no symlinked entries today (`git ls-files -s`
        # shows no 120000 mode), so this changes nothing about what is published; it is
        # here so that if one ever appears, the signed file says what it is instead of
        # quietly lying. An unreadable path raises out of package_digest() and fails the
        # job, which is correct: never sign a digest over a tree we could not fully read.
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from clawseccheck import __version__
          from clawseccheck.integrity import (
              NOTE_PATH_ESCAPE, NOTE_SYMLINK, package_digest,
          )

          notes = []
          combined, per_file = package_digest(notes=notes)
          uncovered = {rel: (kind, detail) for kind, rel, detail in notes
                       if kind in (NOTE_SYMLINK, NOTE_PATH_ESCAPE)}
          lines = [
              f"ClawSecCheck {__version__} — engine source digest (SHA-256)",
              f"combined : {combined}",
              "",
          ]
          for name, digest in sorted(per_file.items()):
              note = uncovered.get(name)
              if note is None:
                  lines.append(f"  {digest}  {name}")
              else:
                  kind, target = note
                  lines.append(f"  {digest}  {name}  [{kind} -> {target}; "
                               f"name and target hashed, target contents NOT read]")
          lines.append("")
          lines.append(
              "Compare the 'combined' value against the output of `clawseccheck --verify-self`."
          )
          lines.append("Any mismatch means a source file was modified after this release.")
          with open("SHA256SUMS.txt", "w") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF
          echo "Wrote SHA256SUMS.txt:" && cat SHA256SUMS.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign SHA256SUMS.txt (cosign keyless/OIDC)
        # Keyless signing: cosign exchanges this job's GitHub Actions OIDC token
        # (id-token: write, above) for a short-lived cert from Fulcio, signs the
        # blob, and uploads the entry to the public Rekor transparency log —
        # no signing key or secret to generate, store, or rotate. Anyone can later
        # verify SHA256SUMS.txt was produced by *this* repo's release workflow with
        # `cosign verify-blob --bundle` (exact command published in README/FAQ),
        # without ever trusting a key we'd have to keep secret.
        #
        # Output is a single Sigstore bundle (signature + cert + Rekor proof) rather
        # than the old detached .sig/.pem pair: cosign v3 (installer v4) flips
        # --new-bundle-format's default to true, which silently ignores the
        # --output-signature/--output-certificate flags (C-189). --bundle is the
        # supported single-file path and round-trips on both cosign v2 and v3.
        id: sign
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle SHA256SUMS.txt.bundle \
            SHA256SUMS.txt
          echo "Signed SHA256SUMS.txt -> SHA256SUMS.txt.bundle"

      - name: Log in to ClawHub
        # Token is passed only via env — never echoed or printed.
        run: clawhub login --token "$CLAWHUB_TOKEN"
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Preflight — confirm the PREVIOUS release actually surfaced on ClawHub
        # `clawhub publish` printing "OK. Published <slug>@<ver> (<id>)" is NOT proof that
        # users can get the release. On 2026-07-20 v3.54.0 published successfully (id
        # k976gwey83j4s49sb7xfk4fzz58axb52) and never appeared: the registry's own scan
        # reported status "succeeded" while its PRIMARY verdict (clawscan.json) came back
        # null — along with skillspector.json and virustotal.json — so the version stayed
        # accepted-but-invisible. Nothing in this pipeline noticed; a human found it four
        # hours later by loading the web page.
        #
        # This gate deliberately checks the PREVIOUS release, not the one about to be
        # published. By the time a new release runs, hours or days have passed, so a 404 is
        # unambiguous and this can safely be a hard failure. Checking the CURRENT version
        # straight after upload could NOT be a hard gate — legitimate indexing lag has been
        # observed at 29+ minutes (v3.52.1) — which is why that one is warn-only, after the
        # publish step below.
        #
        # PREV comes from CHANGELOG.md rather than git tags: actions/checkout does not fetch
        # tags by default, and tests/test_version_coherence.py already pins the changelog's
        # top entry to __version__, so the second entry is the previous release by
        # construction.
        #
        # "By construction" holds only if every changelogged version was actually released,
        # and on 2026-09-17 that broke: 4.1.1 was bumped and changelogged, never published
        # (the work sat unpushed and grew into 4.2.0), and its entry stayed behind. This
        # step then curled for a release that never existed, got 404, and blocked v4.2.0
        # while reporting "published but never surfaced" — sending the operator to
        # investigate a publishing incident that had not happened. A 404 alone cannot tell
        # the two apart, so the tag is consulted before the verdict is written: no tag means
        # we never attempted to publish it, which is a wrong CHANGELOG, not a lost release.
        env:
          SKIP_CHECK: ${{ inputs.skip_previous_release_check }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${SKIP_CHECK:-false}" = "true" ]; then
            echo "::notice::Previous-release check skipped by explicit workflow input."
            exit 0
          fi
          PREV="$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
                  | sed -n '2p' | tr -cd '0-9.')"
          if [ -z "$PREV" ]; then
            echo "::notice::No previous CHANGELOG entry (first release?) — nothing to verify."
            exit 0
          fi
          API="https://clawhub.ai/api/v1/skills/clawseccheck/versions/${PREV}"
          # A6: `-w` already prints '000' itself on a transport failure (curl also
          # exits non-zero in that case), so `|| echo 000` used to run TOO, appending a
          # second '000' inside the same command substitution and garbling CODE. The
          # fallback now lives outside the substitution, where it *replaces* CODE
          # instead of being concatenated onto whatever curl already wrote out.
          # --retry gives a transient blip (not a real outage) a chance to resolve
          # before this becomes a hard release-blocking failure.
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 2 "$API")" || CODE="000"
          if [ "$CODE" = "200" ]; then
            echo "Previous release ${PREV} is live on ClawHub."
            exit 0
          fi

          # Was PREV ever actually released? A tag is this repo's record of the attempt —
          # §6 tags first, then the tag push triggers this workflow — so no tag means no
          # publish was ever tried, and a 404 is then expected rather than alarming.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${PREV}" >/dev/null 2>&1; then
            PREV_TAGGED=true
          else
            PREV_TAGGED=false
          fi

          if [ "$PREV_TAGGED" = "false" ]; then
            echo "::error::CHANGELOG.md's previous entry is ${PREV}, but no tag v${PREV}" \
                 "exists — that version was never released, so its 404 on ClawHub is" \
                 "expected, not an incident. The CHANGELOG is what is wrong: fold the" \
                 "${PREV} entry into the release that actually ships its content, or" \
                 "release ${PREV} first. Do NOT reach for skip_previous_release_check" \
                 "here — it would publish on top of a changelog that describes a release" \
                 "that does not exist."
            exit 1
          fi

          echo "::error::Previous release ${PREV} is NOT on ClawHub (HTTP ${CODE}), and" \
               "v${PREV} IS tagged — so it was published and never surfaced. Publishing" \
               "another version on top of it will bury the problem. Investigate first, or" \
               "re-run with skip_previous_release_check=true to proceed deliberately."

          # Auto-diagnose so nobody has to repeat the manual investigation. A stalled scan
          # shows up as null scanner outputs (~5 bytes) next to a populated static-analysis
          # and a manifest that still claims status "succeeded".
          echo "--- stored scan report for ${PREV} ---"
          if clawhub scan download clawseccheck --version "$PREV" >/tmp/scandl.txt 2>&1; then
            cat /tmp/scandl.txt
            ZIP="$(sed -n 's/^Report ZIP: //p' /tmp/scandl.txt | head -1)"
            if [ -n "$ZIP" ] && [ -f "$ZIP" ] && unzip -o -q "$ZIP" -d /tmp/scanrep; then
              echo "scanner outputs (a ~5-byte file is a null verdict):"
              for f in /tmp/scanrep/*.json; do
                printf '  %8s bytes  %s\n' "$(wc -c <"$f")" "$(basename "$f")"
              done
              echo "manifest:"; cat /tmp/scanrep/manifest.json || true
            fi
          else
            cat /tmp/scandl.txt || true
          fi
          exit 1

      - name: Stage publishable files (exclude tests/ + fixtures/)
        # ClawSecCheck is a security auditor: tests/ and fixtures/ contain intentionally
        # vulnerable example configs (docker.sock, allowFrom "*", dangerouslyAllowPrivateNetwork)
        # that the engine DETECTS in others. They are test data, never the skill's own config —
        # but a scanner pointed at the published tree mis-reads them as live settings. The smoke
        # gate above already ran the full suite on the complete checkout; we publish only the
        # runtime + docs so the audited artifact contains no decoy configs.
        #
        # We still nest the staging dir under dist/ with basename "clawseccheck" (not the old
        # "dist-skill" → "Dist Skill", B-015) so the dir-derived fallback name is sane, but the
        # authoritative title is now set explicitly with the --name flag below — the dir
        # basename is only a fallback. dist/clawseccheck also avoids colliding with the
        # clawseccheck/ package during the cp.
        run: |
          rm -rf dist && mkdir -p dist/clawseccheck
          cp -r clawseccheck SKILL.md README.md LICENSE TRADEMARK.md \
                SECURITY.md SECURITY_MODEL.md SUPPORT.md CHANGELOG.md pyproject.toml docs audit.py \
                dist/clawseccheck/
          # SKILL.md points the host agent at references/cli-flags.md for the full flag
          # reference; without it every ClawHub install shipped a dangling link (B-254).
          # Ship ONLY what the manifest actually links: references/design-system.md is a
          # repo-internal design doc with no runtime role, so it stays out of installs.
          # tests/test_publish_workflow.py cross-checks every relative SKILL.md link
          # against what this step copies, so a new link cannot silently go dangling.
          mkdir -p dist/clawseccheck/references
          cp references/cli-flags.md dist/clawseccheck/references/
          find dist/clawseccheck -name '__pycache__' -type d -prune -exec rm -rf {} + || true
          # Repo-page images (README banner/screenshot + their sources) are for GitHub only —
          # they'd add ~650KB of dead weight to every skill install.
          rm -rf dist/clawseccheck/docs/assets
          # CHANGELOG.md accumulates every release forever (352KB / 200 entries as of
          # v3.59.0) and `clawhub publish` uploads every staged file as a raw,
          # uncompressed multipart form part (dist/cli/commands/publish.js — no
          # tar/gzip on this path, confirmed by reading the installed CLI; the
          # unrelated `clawpack` command does gzip, `publish` does not) — so this file
          # alone was ~6% of the payload that hit ClawHub's upload-size limit
          # (v3.59.0's 5.6MB staged tree 413'd; v3.58.0's 4.5MB succeeded). The
          # published copy keeps only the most recent releases; the git-tracked
          # CHANGELOG.md itself is untouched — full history stays on GitHub.
          KEEP_CHANGELOG_RELEASES=10
          CUTOFF_LINE="$(grep -n '^## \[' dist/clawseccheck/CHANGELOG.md | sed -n "$((KEEP_CHANGELOG_RELEASES + 1))p" | cut -d: -f1)"
          if [ -n "$CUTOFF_LINE" ]; then
            head -n "$((CUTOFF_LINE - 1))" dist/clawseccheck/CHANGELOG.md > /tmp/changelog-trimmed.md
            {
              echo ""
              echo "---"
              echo ""
              echo "_Older entries omitted from the published package to keep it small — full history:_"
              echo "_<https://github.com/gl0di/clawseccheck/blob/main/CHANGELOG.md>_"
            } >> /tmp/changelog-trimmed.md
            mv /tmp/changelog-trimmed.md dist/clawseccheck/CHANGELOG.md
          fi
          echo "Staged for publish:" && ls -1 dist/clawseccheck
          echo "Staged size: $(du -sh dist/clawseccheck | cut -f1)"

      - name: Guard — fail fast if the staged bundle is unexpectedly large
        # A10: `environment: release` is ONE job-level approval gate, checked once
        # before the job's steps even start (including checkout) — it is not a
        # per-step budget that each later step individually "spends". This guard still
        # runs as early as possible after staging so an obviously-wrong bundle — a
        # stray binary, a re-added docs/assets tree — is caught before the rest of the
        # job's (already-approved) work runs on it, rather than surfacing only at real
        # upload time. `clawhub publish` uploads every staged file as a raw, uncompressed
        # multipart form part (no tar/gzip on this path — confirmed by reading the
        # installed CLI), so the staged tree size on disk IS the upload size.
        #
        # RECALIBRATED 2026-08-05. The original 5 MiB threshold was bracketed against a
        # 413 that turned out not to be a bundle-size limit at all: uploads went through a
        # Vercel-fronted route whose request-body cap sat far below ClawHub's documented
        # 50MB (upstream openclaw/clawhub#3375). PR #3391 reroutes staging to a direct
        # Convex upload, and once that was deployed v3.59.0's 5,235,253-byte staged tree —
        # the very bundle the old bracket called "known bad" — published successfully.
        # The old gap was measuring someone else's infrastructure, not our size; holding
        # the threshold there would block ordinary releases for a defect that is gone.
        run: |
          set -euo pipefail
          # Anchored to two measured facts rather than to a failure bracket:
          #   * last known-good publish — 5,235,253 bytes (v3.59.0, 2026-08-05, Convex route)
          #   * ClawHub's documented cap for POST /api/v1/skills — 50MB
          # 10 MiB is ~2x the former and ~20% of the latter: loose enough that ordinary
          # growth never trips it, tight enough that accidental bloat still does.
          MAX_STAGED_BYTES=10485760  # 10 MiB
          # python3, not `du -sb`: -b/--bytes is a GNU coreutils extension, absent from
          # BSD du (macOS runners in the CI matrix) — `du: invalid option -- b`. python3
          # is unconditionally on PATH in this job already (the smoke gate above runs
          # pytest) and sums real file bytes the same way -b does (apparent size, not
          # allocated blocks), on every platform this workflow runs on.
          STAGED_BYTES="$(python3 -c 'import pathlib; print(sum(f.stat().st_size for f in pathlib.Path("dist/clawseccheck").rglob("*") if f.is_file()))')"
          if [ "$STAGED_BYTES" -gt "$MAX_STAGED_BYTES" ]; then
            echo "::error::Staged bundle is ${STAGED_BYTES} bytes, over the pre-upload guard" \
                 "threshold of ${MAX_STAGED_BYTES} bytes (10 MiB). That is far above any" \
                 "bundle this project has ever published, so treat it as accidental bloat" \
                 "— check for a stray binary or a re-added docs/assets tree — rather than" \
                 "as a limit to raise. ClawHub's documented cap is 50MB; if the staged tree" \
                 "has genuinely grown this much on purpose, re-ground this threshold" \
                 "against a real publish before pushing a release tag."
            exit 1
          fi
          echo "Staged bundle size OK: ${STAGED_BYTES} bytes (guard limit ${MAX_STAGED_BYTES})."

      - name: Preflight — verify the staged tree locally
        # Cheap, offline, deterministic checks on the artifact we are about to upload.
        # These run before the CLI dry-run so an obviously broken bundle fails with a
        # precise message instead of a generic CLI error (C-248).
        run: |
          set -euo pipefail
          test -f dist/clawseccheck/SKILL.md \
            || { echo "::error::staged tree has no SKILL.md — clawhub would reject it"; exit 1; }
          # Every relative link in SKILL.md must resolve inside the staged tree. This is the
          # publish-time twin of tests/test_publish_workflow.py's static cross-check (B-254).
          #
          # THE LINK-TARGET NORMALISATION CONTRACT (four rules, applied in this order).
          # tests/test_publish_workflow.py's _normalise_link_target() implements the exact
          # same four rules in Python, and test_preflight_shell_agrees_with_python_normaliser
          # executes THIS block and diffs its output against that function. Change one side
          # and the suite goes red — the two resolvers cannot drift apart again.
          #   1. drop an optional `"title"` suffix (everything from the first whitespace)
          #   2. skip absolute URLs / mailto: / pure #anchors
          #   3. drop the #fragment
          #   4. drop a leading ./
          MISSING=0
          while IFS= read -r raw; do
            target="${raw%% *}"
            case "$target" in http://*|https://*|mailto:*|"#"*) continue ;; esac
            target="${target%%#*}"
            target="${target#./}"
            [ -n "$target" ] || continue
            if [ ! -e "dist/clawseccheck/${target}" ]; then
              echo "::error::SKILL.md links to '${target}' but it is not in the staged tree"
              MISSING=1
            fi
          # Strip fenced blocks and inline code spans BEFORE extracting links — the same
          # two removals tests/test_publish_workflow.py's _prose_only() makes, and for the
          # same reason it was added there (B-606): SKILL.md has to SHOW the forbidden
          # `[report.pdf](path)` syntax in order to warn against it, and a naive extractor
          # reads that illustration as a dangling link. The Python side learned this; this
          # block did not, because the drift test compared only the four NORMALISATION
          # rules and never what the two sides EXTRACT. It compares both now.
          done < <(
            awk 'BEGIN{fence=0} /^[[:space:]]*```/{fence=!fence; next} !fence' \
                dist/clawseccheck/SKILL.md \
              | sed -E 's/`[^`]*`//g' \
              | grep -oE '\]\([^)]+\)' | sed -E 's/^\]\(//; s/\)$//')
          [ "$MISSING" -eq 0 ] || exit 1
          echo "Preflight OK — SKILL.md present and every relative link resolves."

      - name: Preflight — confirm the CURRENT version is not already published
        # A5: this workflow already curls this same endpoint twice for OTHER versions
        # (the previous-release check above, and the warn-only post-publish check below)
        # but never once for the version this run is about to publish. `clawhub publish`
        # rejects a duplicate with its own error ("Version X already exists") only after
        # the approval gate has already been spent and the dry-run has already run — so a
        # re-run against an already-published version (e.g. re-triggering this workflow by
        # hand on a tag that already shipped) wastes a click and ~10 minutes for a result
        # this one curl call can rule out up front, before the dry-run even starts.
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # --retry matches the file's two other curl sites so a transient blip doesn't
          # end a release. What this site deliberately does NOT copy from them is their
          # `|| CODE="000"` fallback: they can treat an unreachable registry as "not
          # confirmed" and carry on, because their own logic re-decides afterwards. Here
          # an unknown answer must never read as "not published" — that is precisely the
          # state this step exists to rule out — so an exhausted retry stays fatal under
          # `set -e` and blocks the release instead of guessing.
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 2 \
            "https://clawhub.ai/api/v1/skills/clawseccheck/versions/${VER}")"
          if [ "$CODE" = "200" ]; then
            echo "::error::Version ${VER} is already published on ClawHub — nothing to do."
            exit 1
          fi

      # NB: this step runs `clawhub publish` too, so it is the SECOND invocation in this
      # file. tests/test_publish_workflow.py is step-aware (it attributes each invocation
      # to its own step and tells the two apart by --dry-run) precisely so that this
      # preflight cannot shadow the real Publish step's path/--name guards. Do not go back
      # to locating "the publish command" by first-match on a raw line scan.
      - name: Preflight — dry-run the upload (no write)
        # Grounded: the CLI exposes `--dry-run` (options.dryRun, clawhub 0.23.3
        # dist/cli/commands/publish.js) on the same `publish` command used below. It validates the
        # folder, rejects a plugin-shaped tree, requires SKILL.md, checks the semver, and
        # resolves the version against the registry — all WITHOUT uploading. Running it
        # with the identical flag set means a bundle that fails here would have failed the
        # real publish, but before anything is written to the registry.
        run: >
          clawhub publish ./dist/clawseccheck
          --slug clawseccheck
          --owner gl0di
          --name "ClawSecCheck — OpenClaw Security Self-Audit"
          --version "${{ steps.ver.outputs.version }}"
          --changelog "Release ${{ steps.ver.outputs.version }} (${{ github.sha }})"
          --dry-run

      - name: Probe pre-publish liveness
        # C-368: classifies (never gates) whether this version was ALREADY live on
        # ClawHub immediately before this run's own publish attempt — the narrow race
        # window left after the "not already published" preflight above (which already
        # hard-fails the common case of re-running on a shipped tag) and this run's
        # own upload. Its answer tells "Decide release action" below whether a later
        # CLI-reported failure means "the #3349 ghost reservation actually published
        # our bundle" (pre_live=false) or "this exact version was already live for
        # some other reason" (pre_live=true, i.e. a genuine DUPLICATE) — it never
        # blocks anything itself.
        id: pre
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if bash .github/scripts/clawhub-version-live.sh clawseccheck "$VER"; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish skill
        # --name sets the human-facing ClawHub title (grounded: the CLI's `publish --help`
        # lists "--name <name>  Display name"). Without it ClawHub falls back to the
        # title-cased dir basename ("Clawseccheck"). This value MUST equal SKILL.md
        # metadata.display_name.en — tests/test_publish_workflow.py fails the build if they
        # drift, so the title stays a single source of truth (B-015 fix-item 2).
        #
        # C-368: continue-on-error + id: publish — see "Decide release action" below.
        # The ClawHub CLI has a proven false-failure mode (the #3349 ghost reservation):
        # it can exit 1 with "Version X already exists" on a run whose upload actually
        # succeeded and surfaces minutes later. Treating that exit code as authoritative
        # used to abort the whole job right here, silently skipping the GitHub Release
        # and leaving the surfaced-check unable to run — for a publish that, in fact,
        # had worked (v3.59.0, v3.60.0, v3.61.0). The CLI's own outcome is now advisory
        # input to Decide; the ClawHub API (queried by Confirm below) is authoritative.
        id: publish
        continue-on-error: true
        run: >
          clawhub publish ./dist/clawseccheck
          --slug clawseccheck
          --owner gl0di
          --name "ClawSecCheck — OpenClaw Security Self-Audit"
          --version "${{ steps.ver.outputs.version }}"
          --changelog "Release ${{ steps.ver.outputs.version }} (${{ github.sha }})"

      - name: Confirm publication surfaced
        # C-368: only runs when the CLI reported failure, so a normal success pays no
        # poll cost. Polls up to 40×60s (clears the ~29-minute worst observed indexing
        # lag, v3.52.1) for the helper's two-signal check to flip true — what separates
        # a #3349 false failure (the bundle really did land) from a genuine one (413,
        # auth, a real duplicate). Deliberately never `exit 1` here: this step only
        # REPORTS: "Decide release action" below is the single place that turns a
        # confirmed non-surfacing into a failed job.
        id: confirm
        if: ${{ !cancelled() && steps.publish.outcome == 'failure' }}
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          LIVE=false
          for i in $(seq 1 40); do
            if bash .github/scripts/clawhub-version-live.sh clawseccheck "$VER"; then
              LIVE=true
              echo "Version ${VER} confirmed live on ClawHub after ~${i} min despite the" \
                   "CLI-reported failure — this is the #3349 ghost-reservation false" \
                   "failure, not a real one."
              break
            fi
            if [ "$i" -lt 40 ]; then
              sleep 60
            fi
          done
          echo "live=${LIVE}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version surfaced (warn only)
        # Deliberately NOT a hard gate. Indexing lag is real and variable: v3.53.0 was fully
        # processed in ~20 minutes, while v3.52.1 still 404'd 29 minutes after upload and
        # landed later with a backdated createdAt. Failing the build on that would be a false
        # alarm, and this repo does not ship false alarms. A version that never surfaces is
        # caught for real by the previous-release gate at the top of the NEXT release.
        #
        # `if: ${{ !cancelled() }}` (A1): without it this step inherits the default implicit
        # success() condition, so it is skipped exactly when the Publish step above fails —
        # the one scenario this reality-probe exists for. !cancelled() runs it after any
        # earlier failure short of the job being cancelled, so a failed publish still gets
        # checked instead of leaving the run silent about what actually happened.
        if: ${{ !cancelled() }}
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          API="https://clawhub.ai/api/v1/skills/clawseccheck/versions/${VER}"
          for i in $(seq 1 10); do
            # A6: see the previous-release preflight above for why the fallback lives
            # outside the command substitution instead of `|| echo 000` inside it.
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 2 "$API")" || CODE="000"
            if [ "$CODE" = "200" ]; then
              echo "Version ${VER} is live on ClawHub (visible after ~${i} min)."
              exit 0
            fi
            # A7: don't burn the trailing sleep after the last attempt — nothing
            # reads it, it only stretches every failing run to the full 10 minutes.
            if [ "$i" -lt 10 ]; then
              sleep 60
            fi
          done
          echo "::warning::Version ${VER} was accepted but is not visible after 10 minutes" \
               "(HTTP ${CODE}). This is usually just indexing lag. If it never appears, the" \
               "next release will fail its previous-release preflight — check the page, or" \
               "run: clawhub scan download clawseccheck --version ${VER}"

      - name: Decide release action
        # C-368: the single place that turns {CLI outcome, pre-publish liveness,
        # post-failure confirmation} into a verdict. The ClawHub API (Probe/Confirm) is
        # authoritative; the CLI's own exit code is advisory only, because it has a
        # proven false-failure mode (#3349). Truth table:
        #   publish succeeded                                    -> PUBLISHED           (release, pass)
        #   publish failed, Confirm live, wasn't live beforehand  -> PUBLISHED_VIA_GHOST (release, pass)
        #   publish failed, Confirm live, WAS live beforehand     -> DUPLICATE           (release, pass)
        #   publish failed, Confirm not live                      -> GENUINE_FAILURE     (no release, FAIL)
        # Pure logic over the three earlier steps' outputs — no network calls here, so
        # this step itself cannot flake. `!cancelled()` (not the default success()) so
        # it still runs and logs an explicit verdict even after an earlier hard failure
        # (e.g. the smoke gate), landing on GENUINE_FAILURE in that case too.
        id: decide
        if: ${{ !cancelled() }}
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PRE_LIVE: ${{ steps.pre.outputs.live }}
          CONFIRM_LIVE: ${{ steps.confirm.outputs.live }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            VERDICT=PUBLISHED
            CREATE_RELEASE=true
            FAIL_JOB=false
          elif [ "${CONFIRM_LIVE:-false}" = "true" ]; then
            if [ "${PRE_LIVE:-false}" = "true" ]; then
              VERDICT=DUPLICATE
            else
              VERDICT=PUBLISHED_VIA_GHOST
            fi
            CREATE_RELEASE=true
            FAIL_JOB=false
          else
            VERDICT=GENUINE_FAILURE
            CREATE_RELEASE=false
            FAIL_JOB=true
          fi
          if [ "$IS_TAG" != "true" ]; then
            CREATE_RELEASE=false
          fi
          echo "Verdict: ${VERDICT} (publish.outcome=${PUBLISH_OUTCOME}," \
               "pre_live=${PRE_LIVE:-<unset>}, confirm_live=${CONFIRM_LIVE:-<unset>})"
          {
            echo "verdict=${VERDICT}"
            echo "create_release=${CREATE_RELEASE}"
            echo "fail_job=${FAIL_JOB}"
          } >> "$GITHUB_OUTPUT"

      # Create a matching GitHub Release so the "Latest release" badge tracks the tag.
      # Uses the runner's built-in gh CLI (no third-party action → respects the
      # github-owned+verified Actions policy). Notes are pulled from CHANGELOG.md.
      # Also attaches the signed digest (SHA256SUMS.txt + cosign .bundle) generated
      # above, via the same `gh` CLI (`release upload`) rather than a second
      # release-management action, so there is one mechanism for release assets.
      - name: Create GitHub Release
        # Deliberately NOT gated on the publish step having succeeded. ClawHub has a
        # measured false-failure mode: on 2026-08-06 `clawhub publish` uploaded v3.61.0
        # successfully (that version answers 200 on the registry today) and then exited 1
        # with "Version 3.61.0 already exists". Because this step sat downstream of that
        # exit code, it was skipped for v3.59.0, v3.60.0 and v3.61.0 — all three lost
        # their cosign bundle, and the releases were completed by hand with
        # SHA256SUMS.txt alone, while README/FAQ tell users to verify the install with
        # `cosign verify-blob --bundle`. The signed digest is a property of the TAGGED
        # TREE, not of the registry, so it must land whatever the registry replied.
        #
        # C-368: gated on Decide's verdict instead of `steps.sign.outcome == 'success'`
        # alone. Decide already folds that precondition in — a signing failure means
        # Publish never even ran, so publish.outcome stays unset, Confirm never runs
        # (its own `if:` requires outcome == 'failure'), and Decide lands on
        # GENUINE_FAILURE — while ALSO correctly refusing a release for a real
        # 413/auth failure that Publish DID reach (which the old `steps.sign.outcome`
        # gate could not tell apart from a false one; that was this task's own bug).
        if: ${{ !cancelled() && github.ref_type == 'tag' && steps.decide.outputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v v="## [$VER]" 'index($0,v){f=1;next} /^## \[/{f=0} f' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="Release ${GITHUB_REF_NAME} — see CHANGELOG.md."
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "ClawSecCheck ${GITHUB_REF_NAME}" --notes "$NOTES" \
            || echo "GitHub Release already exists for ${GITHUB_REF_NAME}"
          # C-368: --clobber removed — a DUPLICATE verdict must never let this run's
          # bytes silently overwrite a prior, honestly-signed release's assets.
          # Tolerate "already attached" instead of failing loudly on a re-run.
          gh release upload "${GITHUB_REF_NAME}" \
            SHA256SUMS.txt SHA256SUMS.txt.bundle \
            || echo "Release assets already attached for ${GITHUB_REF_NAME} (not overwriting)."

      - name: Finalize job status
        # C-368: the single pass/fail point for this job's publish outcome. Every step
        # upstream either never fails the job on its own (Publish has
        # continue-on-error, Confirm and the warn-only surfaced-check never exit 1) or
        # already fails it honestly on its own defect (smoke gate, signing, staging
        # guards, the earlier preflights) — this step exists so Decide's
        # GENUINE_FAILURE verdict actually fails the job, since Publish's own
        # continue-on-error would otherwise let a real publish failure go green.
        if: always()
        env:
          FAIL_JOB: ${{ steps.decide.outputs.fail_job }}
          VERDICT: ${{ steps.decide.outputs.verdict }}
        run: |
          set -euo pipefail
          if [ "${FAIL_JOB:-}" = "true" ]; then
            echo "::error::Publish verdict: ${VERDICT:-UNKNOWN}. Failing the job — see the" \
                 "'Decide release action' step above for why."
            exit 1
          fi
          echo "Publish verdict: ${VERDICT:-<not reached>}. Job passes."
